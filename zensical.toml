# Documentation site, built with Zensical: `uv run zensical build --strict`.
# Preview locally with `uv run zensical serve`.

[project]
site_name = "xstructured"
site_description = "Schema-guided structured output for LangChain v1 Runnables, agents, and graphs: validated Pydantic data and natural-language text from one response."
site_url = "https://xstructured.readthedocs.io/en/latest/"
site_author = "smuniharish"
repo_name = "smuniharish/xstructured"
repo_url = "https://github.com/smuniharish/xstructured"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; xstructured contributors. Released under the Apache License 2.0."
extra_css = ["stylesheets/extra.css"]

