name: Docs

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --global @mermaid-js/mermaid-cli@11.17.0
      - run: node scripts/render-diagrams.mjs --check
      - run: uv sync --frozen --group docs
      - run: uv run mkdocs build --strict
