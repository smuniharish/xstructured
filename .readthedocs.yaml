version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  commands:
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv sync --frozen --no-default-groups --group docs
    - uv run --no-sync mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"

mkdocs:
  configuration: mkdocs.yml
