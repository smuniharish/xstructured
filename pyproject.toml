[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[project]
name = "xstructured"
version = "0.1.1"
description = "Schema-guided structured output for LangChain v1 Runnables and agents: validated Pydantic v2 data and natural-language text from one response, with conservative recovery and ordered streaming."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "S MUNI HARISH", email = "samamuniharish@gmail.com" }]
keywords = [
  "agents",
  "json-schema",
  "langchain",
  "langchain-core",
  "llm",
  "pydantic",
  "streaming",
  "structured-output",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=1.6.6,<2",
  "pydantic>=2.13.5,<3",
]

[project.urls]
Homepage = "https://github.com/smuniharish/xstructured"
Documentation = "https://xstructured.readthedocs.io"
Repository = "https://github.com/smuniharish/xstructured"
Issues = "https://github.com/smuniharish/xstructured/issues"
Changelog = "https://github.com/smuniharish/xstructured/blob/master/CHANGELOG.md"

[dependency-groups]
test = [
  "hypothesis>=6.168.3,<7",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
]
lint = [
  "ruff>=0.16.10,<0.17",
]
types = [
  "pyrefly>=1.3.2,<2",
  "types-pyyaml>=6.0.12.20260906",
]
examples = [
  "deepagents>=0.7.21,<1",
  "langchain>=1.4.3,<2",
  "langchain-openai>=1.6.7,<2",
  "langgraph>=1.2.12,<2",
]
docs = [
  "griffe-pydantic>=1.3.1,<2",
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.7,<10",
  "mkdocstrings>=1.0.6,<2",
  "mkdocstrings-python>=2.0.9,<3",
]
dev = [
  { include-group = "examples" },
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "types" },
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-m", "not live"]
strict = true
testpaths = ["tests"]
pythonpath = [".", "examples"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: performs real network calls to the Experiential Labs provider; requires EXPLABS_API_KEY",
]

[tool.coverage.run]
branch = true
source = ["xstructured"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
# Code is formatted to 80 columns so examples fit the documentation, GitHub, and
# PyPI without horizontal scrolling.
line-length = 80
target-version = "py312"
src = [".", "src", "examples"]
# These pages include the example scripts with `--8<--` snippet directives, which
# are valid Python expressions that the Markdown formatter would rewrite.
extend-exclude = ["docs/examples/*.md"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "ERA", "F", "FA", "FBT",
  "FLY", "FURB", "G", "I", "ICN", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
  "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "T20", "TC", "TID", "TRY", "UP",
  "W", "YTT",
]
ignore = [
  "ANN401",  # LangChain's Runnable API is typed with Any.
  "D105",    # Magic methods are self-describing.
  "D107",    # __init__ arguments are documented on the class.
  "ISC001",  # Conflicts with the formatter.
  "PLR0913", # Public constructors expose keyword-only configuration.
  "TC001",   # Runtime imports keep annotations resolvable for docs and LangChain.
  "TC002",
  "TC003",
  "TRY003",  # Exception messages carry the failing value.
]

[tool.ruff.lint.pycodestyle]
# Long strings, comments, and docstrings the formatter cannot split.
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "tests", "xstructured"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "D", "FBT", "PLC0415", "PLR2004", "S101", "SLF001", "T20"]
"examples/**/*.py" = ["D103", "E402", "PLC0415", "S101", "T201"]
"benchmarks/**/*.py" = ["D", "T201"]
"scripts/**/*.py" = ["D", "T201"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.pyrefly]
project-includes = ["src", "tests", "examples", "benchmarks"]
project-excludes = ["**/.venv/**", "**/build/**", "**/dist/**", "**/site/**"]
search-path = ["src", ".", "examples"]
