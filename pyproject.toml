[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "xstructured"
version = "1.0.0"
description = "Schema-guided structured output for LangChain v1 Runnables and agents: validated Pydantic v2 data and natural-language text from one response, with conservative recovery and ordered streaming."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "S MUNI HARISH", email = "samamuniharish@gmail.com" }]
keywords = [
  "agents",
  "json-schema",
  "langchain",
  "langchain-core",
  "llm",
  "pydantic",
  "streaming",
  "structured-output",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=1.7.6,<2",
  "pydantic>=2.14.3,<3",
]

[project.optional-dependencies]
agents = ["langchain>=1.4.9,<2"]
langgraph = ["langgraph>=1.2.20,<2"]
deepagents = ["deepagents>=0.7.34,<1"]
otel = ["opentelemetry-api>=1.45.2,<2"]
all = ["xstructured[agents,deepagents,langgraph,otel]"]

[project.urls]
Homepage = "https://github.com/smuniharish/xstructured"
Documentation = "https://xstructured.readthedocs.io"
Repository = "https://github.com/smuniharish/xstructured"
Issues = "https://github.com/smuniharish/xstructured/issues"
Changelog = "https://github.com/smuniharish/xstructured/blob/master/CHANGELOG.md"

[dependency-groups]
test = [
  "deepagents>=0.7.34,<1",
  "hypothesis>=6.170.15,<7",
  "langchain>=1.4.9,<2",
  "langgraph>=1.2.20,<2",
  "opentelemetry-api>=1.45.2,<2",
  "opentelemetry-sdk>=1.45.2,<2",
  "pytest>=9.2.0,<10",
  "pytest-asyncio>=1.4.1.post1,<2",
  "pytest-cov>=7.1.0,<8",
  "skills-ref>=0.1.1,<1",
]
lint = [
  "ruff>=0.17.4,<0.18",
]
types = [
  "pyrefly>=1.4.1,<2",
]
examples = [
  "deepagents>=0.7.34,<1",
  "langchain>=1.4.9,<2",
  "langchain-openai>=1.7.4,<2",
  "langgraph>=1.2.20,<2",
  "openai>=3.46.0,<4",
  "opentelemetry-api>=1.45.2,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
  "opentelemetry-sdk>=1.45.2,<2",
]
docs = [
  "griffe-pydantic>=1.3.2,<2",
  "mkdocstrings-python>=2.0.10,<3",
  "zensical>=0.1.0,<0.2",
]
dev = [
  { include-group = "examples" },
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "types" },
]

[tool.uv]
default-groups = ["dev"]
# pyyaml has no wheels for prerelease Pythons, and its source build needs Cython.
extra-build-dependencies = { pyyaml = ["cython"] }

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-m", "not live"]
strict = true
testpaths = ["tests"]
pythonpath = [".", "examples"]
filterwarnings = [
  "error",
  # langsmith, a LangChain dependency, still calls this Python 3.14 deprecation.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: performs real network calls to the Experiential Labs provider; requires EXPLABS_API_KEY",
]

[tool.coverage.run]
branch = true
source = ["xstructured"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
# Code is formatted to 80 columns so examples fit the documentation, GitHub, and
# PyPI without horizontal scrolling.
line-length = 80
target-version = "py312"
src = [".", "src", "examples"]
# These pages include the example scripts with `--8<--` snippet directives, which
# are valid Python expressions that the Markdown formatter would rewrite.
extend-exclude = ["docs/examples/*.md"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "ERA", "F", "FA", "FBT",
  "FLY", "FURB", "G", "I", "ICN", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
  "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "T20", "TC", "TID", "TRY", "UP",
  "W", "YTT",
]
ignore = [
  "ANN401",  # LangChain's Runnable API is typed with Any.
  "D105",    # Magic methods are self-describing.
  "D107",    # __init__ arguments are documented on the class.
  "ISC001",  # Conflicts with the formatter.
  "PLR0913", # Public constructors expose keyword-only configuration.
  "TC001",   # Runtime imports keep annotations resolvable for docs and LangChain.
  "TC002",
  "TC003",
  "TRY003",  # Exception messages carry the failing value.
]

[tool.ruff.lint.pycodestyle]
# Long strings, comments, and docstrings the formatter cannot split.
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "tests", "xstructured"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "D", "FBT", "PLC0415", "PLR2004", "S101", "SLF001", "T20"]
"examples/**/*.py" = ["D103", "E402", "PLC0415", "S101", "T201"]
"benchmarks/**/*.py" = ["D", "T201"]
"scripts/**/*.py" = ["D", "T201"]
"xstructured-skills/**/scripts/*.py" = ["BLE001", "D", "FBT003", "PLC0415", "T201"]
"xstructured-skills/**/assets/*.py" = ["ARG001", "D", "PLC0415", "PLR2004", "S101"]
"xstructured-skills/**/evals/files/**/*.py" = ["D"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.pyrefly]
project-includes = [
  "src",
  "tests",
  "examples",
  "benchmarks",
  "scripts",
  "xstructured-skills",
]
project-excludes = ["**/.venv/**", "**/build/**", "**/dist/**", "**/site/**"]
search-path = [
  "src",
  ".",
  "examples",
  "xstructured-skills/skills/xstructured-extend/assets",
]
